<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Roamitra</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/main.css?v=admin-layout1" rel="stylesheet">
    <script src="assets/js/theme.js"></script>
</head>
<body data-page="admin">
    <nav class="roamitra-navbar"></nav>

    <div class="admin-stage">
        <div class="admin-banner">
            <div class="container admin-banner-inner">
                <p class="admin-kicker">Staff console</p>
                <h1>Admin dashboard</h1>
                <p id="adminHello">Review hosts, bookings, and member roles in one place.</p>
            </div>
        </div>
        <div class="container">
            <div id="adminAlert" class="form-alert error" hidden></div>
            <div id="adminGate" class="admin-gate" hidden>
                <i class="bi bi-shield-lock"></i>
                <h2>Staff only</h2>
                <p>Sign in on the admin login page to open this dashboard.</p>
                <a class="btn-roamitra btn-roamitra-navy" id="adminLoginLink" href="login.html?mode=admin">Admin sign in</a>
            </div>
        </div>
    </div>

    <section class="admin-layout" id="adminApp" hidden>
        <div class="container">
            <div class="admin-stats" id="adminCounts"></div>

            <div class="admin-panel" id="pendingHosts"></div>

            <div class="admin-shell">
                <div class="admin-tabs" id="adminTabs">
                    <button type="button" class="admin-tab-btn active" data-tab="hosts"><i class="bi bi-house-check"></i> Hosts</button>
                    <button type="button" class="admin-tab-btn" data-tab="bookings"><i class="bi bi-calendar2-check"></i> Bookings</button>
                    <button type="button" class="admin-tab-btn" data-tab="users"><i class="bi bi-people"></i> Users</button>
                </div>
                <div class="admin-tab-body">
                    <div id="tab-hosts" class="admin-tab"></div>
                    <div id="tab-bookings" class="admin-tab" hidden></div>
                    <div id="tab-users" class="admin-tab" hidden></div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js?v=media1"></script>
    <script src="assets/js/nav.js?v=avatar2"></script>
    <script src="assets/js/ai-assistant.js"></script>
    <script src="assets/js/admin.js?v=layout2"></script>
</body>
</html>
