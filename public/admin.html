<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Roamitra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/main.css?v=type4" rel="stylesheet">
</head>
<body data-page="admin">
    <nav class="roamitra-navbar"></nav>

    <section class="section-padding">
        <div class="container">
            <p class="planner-kicker mb-1">Staff</p>
            <h1 class="section-title">Admin dashboard</h1>
            <p class="section-subtitle">Become a Host requests land here. Approve or reject them, and review bookings and users.</p>
            <div id="adminAlert" class="form-alert error" hidden></div>
            <div id="adminGate" class="planner-card" hidden>
                <p class="mb-2">Sign in on the admin login page to open this dashboard.</p>
                <a class="btn-roamitra btn-roamitra-navy" id="adminLoginLink" href="login.html?mode=admin">Admin sign in</a>
            </div>
            <div id="adminApp" hidden>
                <div class="row g-3 mb-4" id="adminCounts"></div>
                <div id="pendingHosts" class="mb-4"></div>
                <div class="filter-pills mb-4" id="adminTabs">
                    <button type="button" class="filter-pill active" data-tab="hosts">Host applications</button>
                    <button type="button" class="filter-pill" data-tab="bookings">Bookings</button>
                    <button type="button" class="filter-pill" data-tab="users">Users</button>
                </div>
                <div id="tab-hosts" class="admin-tab"></div>
                <div id="tab-bookings" class="admin-tab" hidden></div>
                <div id="tab-users" class="admin-tab" hidden></div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js?v=vercel3"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/ai-assistant.js"></script>
    <script src="assets/js/admin.js?v=hostreq1"></script>
</body>
</html>
