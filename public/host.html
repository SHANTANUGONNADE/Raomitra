<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Host — Roamitra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/main.css?v=type4" rel="stylesheet">
</head>
<body data-page="host">
    <nav class="roamitra-navbar"></nav>

    <section class="section-padding">
        <div class="container" style="max-width:760px;">
            <p class="planner-kicker mb-1">Ask to Host</p>
            <h1 class="section-title">Become a host</h1>
            <p class="section-subtitle">Send a request to host travelers or list a vehicle. It appears on the Admin dashboard for approval.</p>

            <div id="hostStatus" class="form-alert" hidden></div>
            <div id="hostExisting" class="planner-card mb-4" hidden></div>

            <form id="hostForm" class="planner-card planner-form">
                <fieldset class="mb-3">
                    <legend class="form-label fw-semibold">What do you want to list?</legend>
                    <div class="planner-options">
                        <label class="choice-card"><input type="radio" name="listing_type" value="host" checked> Local host / stay</label>
                        <label class="choice-card"><input type="radio" name="listing_type" value="vehicle"> Vehicle rental</label>
                    </div>
                </fieldset>
                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold" for="city">City</label>
                        <input class="form-control" id="city" name="city" required placeholder="e.g. Bangalore">
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold" for="country">Country</label>
                        <input class="form-control" id="country" name="country" value="India" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="phone">Phone</label>
                    <input class="form-control" id="phone" name="phone" required placeholder="+91 …">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="experience">Hosting / rental experience</label>
                    <select class="form-select" id="experience" name="experience">
                        <option value="new">Just getting started</option>
                        <option value="1-2 years">1–2 years</option>
                        <option value="3+ years">3+ years</option>
                    </select>
                </div>
                <div class="mb-3" id="vehicleWrap" hidden>
                    <label class="form-label fw-semibold" for="vehicle_info">Vehicle details</label>
                    <input class="form-control" id="vehicle_info" name="vehicle_info" placeholder="e.g. Honda Activa 6G, 2022, with helmets">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="bio">About you</label>
                    <textarea class="form-control" id="bio" name="bio" rows="4" required placeholder="Tell travelers who you are and how you help guests."></textarea>
                </div>
                <button type="submit" class="btn-roamitra btn-roamitra-navy" id="hostSubmit">Submit application</button>
            </form>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js?v=vercel2"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/ai-assistant.js"></script>
    <script src="assets/js/host.js?v=hostreq1"></script>
</body>
</html>
