<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — Roamitra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/main.css?v=type4" rel="stylesheet">
</head>
<body data-page="profile">
    <nav class="roamitra-navbar">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between">
                <a href="index.html" class="navbar-brand">
                    <img src="assets/images/logo.png" alt="Roamitra" class="roamitra-logo-img">
                    <span class="roamitra-logo-text">roamitra</span>
                </a>
                <ul class="roamitra-nav-links d-none d-lg-flex">
                    <li><a href="explore.html" class="nav-link" data-nav="explore"><i class="bi bi-compass"></i> Explore</a></li>
                    <li><a href="community.html" class="nav-link" data-nav="community"><i class="bi bi-people"></i> Community</a></li>
                    <li><a href="explore.html" class="nav-link ai-link"><i class="bi bi-stars"></i> Roamitra AI</a></li>
                </ul>
                <div class="roamitra-nav-actions d-none d-lg-flex">
                    <button class="roamitra-lang-select" type="button">EN <i class="bi bi-chevron-down" style="font-size:0.7rem;"></i></button>
                    <a href="login.html" class="btn-roamitra btn-roamitra-ghost">Log in</a>
                    <a href="signup.html" class="btn-roamitra btn-roamitra-primary">Sign up</a>
                </div>
                <button class="roamitra-navbar-toggler d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#mobileNav" aria-label="Toggle navigation"><i class="bi bi-list"></i></button>
            </div>
            <div class="collapse d-lg-none" id="mobileNav">
                <div class="roamitra-mobile-nav">
                    <a href="explore.html" class="nav-link">Explore</a>
                    <a href="community.html" class="nav-link">Community</a>
                    <div class="d-flex gap-2 mt-3">
                        <a href="login.html" class="btn-roamitra btn-roamitra-outline flex-fill">Log in</a>
                        <a href="signup.html" class="btn-roamitra btn-roamitra-primary flex-fill">Sign up</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="profile-cover" style="background:linear-gradient(135deg,#1D4ED8,#121A2B);"></div>
    <section class="profile-header">
        <div class="container">
            <div class="profile-header-inner">
                <div id="profileAlert" class="form-alert error" hidden></div>
                <div class="profile-avatar-wrap">
                    <div class="profile-avatar d-flex align-items-center justify-content-center" style="background:var(--color-primary);color:#fff;font-size:2.5rem;font-weight:800;" id="profileInitial">U</div>
                    <div class="profile-actions">
                        <a href="planner.html" class="btn-roamitra btn-roamitra-navy btn-roamitra-sm">Plan a trip</a>
                        <button type="button" class="btn-roamitra btn-roamitra-outline btn-roamitra-sm" id="logoutBtn">Log out</button>
                    </div>
                </div>
                <h1 class="profile-name" id="profileName">Your profile</h1>
                <p class="profile-location" id="profileEmail"></p>
            </div>
        </div>
    </section>

    <section class="profile-layout">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-4">
                    <aside class="profile-sidebar">
                        <div class="profile-card" id="walletSection">
                            <h3><i class="bi bi-wallet2"></i> Wallet</h3>
                            <div class="wallet-hero mb-3">
                                <div class="small">Available balance</div>
                                <strong id="walletBalance">USD 0.00</strong>
                                <p>Stored in your Roamitra wallet. Checkout is not enabled in this app, so no charges are processed here.</p>
                            </div>
                            <h4 class="h6">Ledger</h4>
                            <ul class="wallet-tx" id="walletTx"></ul>
                        </div>
                    </aside>
                </div>
                <div class="col-lg-8">
                    <div class="profile-card">
                        <h3>Your trips</h3>
                        <div id="profileTrips"></div>
                    </div>
                    <div id="profileExtra"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js?v=vercel3"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/ai-assistant.js"></script>
    <script src="assets/js/profile.js"></script>
</body>
</html>
