<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — Roamitra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/main.css?v=profile-layout4" rel="stylesheet">
    <script src="assets/js/theme.js"></script>
</head>
<body data-page="profile">
    <nav class="roamitra-navbar"></nav>

    <div class="profile-stage">
        <div class="profile-cover" id="profileCover">
            <div class="profile-cover-glow"></div>
            <div class="profile-cover-actions">
                <label class="profile-photo-btn">
                    <i class="bi bi-camera"></i> Cover
                    <input type="file" id="coverFile" accept="image/jpeg,image/png,image/webp" hidden>
                </label>
                <div class="profile-cover-presets" id="coverPresets">
                    <button type="button" class="cover-swatch" data-preset="forest" title="Forest"></button>
                    <button type="button" class="cover-swatch" data-preset="ocean" title="Ocean"></button>
                    <button type="button" class="cover-swatch" data-preset="sunset" title="Sunset"></button>
                    <button type="button" class="cover-swatch" data-preset="dusk" title="Dusk"></button>
                    <button type="button" class="cover-swatch" data-preset="night" title="Night"></button>
                </div>
            </div>
        </div>

        <div class="container profile-stage-inner">
            <div class="profile-sheet">
                <div id="profileAlert" class="form-alert error" hidden></div>
                <div id="profileSuccess" class="form-alert auth-success" hidden></div>
                <div class="profile-identity">
                    <div class="profile-avatar-stage">
                        <div class="profile-avatar" id="profileAvatar">U</div>
                        <label class="profile-avatar-cam" title="Change photo">
                            <i class="bi bi-camera-fill"></i>
                            <input type="file" id="avatarFile" accept="image/jpeg,image/png,image/webp" hidden>
                        </label>
                    </div>
                    <div class="profile-identity-copy">
                        <p class="profile-role-pill" id="profileRole">Member</p>
                        <h1 class="profile-name" id="profileName">Your profile</h1>
                        <p class="profile-location" id="profileMeta"></p>
                        <p class="profile-headline" id="profileBio">Add a short intro so travelers know who you are.</p>
                        <div class="profile-actions">
                            <a href="planner.html" class="btn-roamitra btn-roamitra-navy btn-roamitra-sm"><i class="bi bi-map"></i> Plan a trip</a>
                            <button type="button" class="btn-roamitra btn-roamitra-outline btn-roamitra-sm" id="editToggle"><i class="bi bi-pencil"></i> Edit profile</button>
                            <button type="button" class="btn-roamitra btn-roamitra-ghost btn-roamitra-sm" id="logoutBtn">Log out</button>
                        </div>
                    </div>
                </div>
                <div class="profile-stats" id="profileStats"></div>
            </div>
        </div>
    </div>

    <section class="profile-layout">
        <div class="container">
            <form class="profile-card profile-edit-card" id="profileForm" hidden>
                <h3><i class="bi bi-sliders"></i> Customize your profile</h3>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="fullName">Display name</label>
                        <input class="form-control" id="fullName" name="full_name" maxlength="120" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="userLocation">City / base</label>
                        <input class="form-control" id="userLocation" name="location" maxlength="120" placeholder="Bangalore, India">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold" for="userBio">About you</label>
                        <textarea class="form-control" id="userBio" name="bio" rows="3" maxlength="400" placeholder="Food, hiking, hidden cafes, or how you like to travel…"></textarea>
                    </div>
                </div>
                <div class="d-flex flex-wrap gap-2 mt-3">
                    <button type="submit" class="btn-roamitra btn-roamitra-navy btn-roamitra-sm" id="saveProfile">Save changes</button>
                    <button type="button" class="btn-roamitra btn-roamitra-ghost btn-roamitra-sm" id="cancelEdit">Cancel</button>
                </div>
            </form>

            <div class="profile-shortcuts" id="profileShortcuts"></div>

            <div class="row g-4">
                <div class="col-lg-4">
                    <aside class="profile-sidebar">
                        <div class="profile-card profile-about-card">
                            <h3>About</h3>
                            <div class="profile-info-item"><i class="bi bi-geo-alt"></i> <span id="aboutLocation">Add your city</span></div>
                            <div class="profile-info-item"><i class="bi bi-envelope"></i> <span id="aboutEmail"></span></div>
                            <div class="profile-info-item"><i class="bi bi-shield-check"></i> <span id="aboutRole"></span></div>
                        </div>
                        <div class="profile-card wallet-card" id="walletSection">
                            <h3><i class="bi bi-wallet2"></i> Wallet</h3>
                            <div class="wallet-hero mb-3">
                                <div class="small">Available balance</div>
                                <strong id="walletBalance">USD 0.00</strong>
                                <p>Ready for trips and rentals. Checkout is not processed in this demo.</p>
                            </div>
                            <h4 class="h6">Ledger</h4>
                            <ul class="wallet-tx" id="walletTx"></ul>
                        </div>
                    </aside>
                </div>
                <div class="col-lg-8">
                    <div class="profile-card profile-feed-card">
                        <div class="profile-card-head">
                            <h3>Your trips</h3>
                            <a class="profile-card-link" href="planner.html">New itinerary</a>
                        </div>
                        <div id="profileTrips"></div>
                    </div>
                    <div id="profileExtra"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js?v=media1"></script>
    <script src="assets/js/nav.js?v=avatar2"></script>
    <script src="assets/js/ai-assistant.js"></script>
    <script src="assets/js/profile.js?v=photos2"></script>
</body>
</html>
