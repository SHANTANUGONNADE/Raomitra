<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a vehicle — Roamitra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/main.css?v=type4" rel="stylesheet">
</head>
<body data-page="booking">
    <nav class="roamitra-navbar"></nav>

    <section class="section-padding">
        <div class="container" style="max-width:880px;">
            <p class="planner-kicker mb-1">Ask to Rent</p>
            <h1 class="section-title">Complete your booking</h1>
            <p class="section-subtitle">Pick your dates and confirm. You will get a booking record in your profile.</p>

            <div id="bookingAlert" class="form-alert error" hidden></div>

            <div class="row g-4">
                <div class="col-md-5">
                    <div class="vehicle-card">
                        <div class="vehicle-image">
                            <img id="bookImage" src="" alt="">
                            <span class="vehicle-category" id="bookCategory">Vehicle</span>
                        </div>
                        <div class="vehicle-body">
                            <h3 class="vehicle-title" id="bookName">Vehicle</h3>
                            <div class="vehicle-price">$<span id="bookRate">0</span> <span>/ day</span></div>
                            <div class="vehicle-location" id="bookLocation"></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-7">
                    <form id="bookingForm" class="planner-card planner-form">
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label class="form-label fw-semibold" for="start_date">Pickup date</label>
                                <input class="form-control" type="date" id="start_date" name="start_date" required>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label fw-semibold" for="end_date">Return date</label>
                                <input class="form-control" type="date" id="end_date" name="end_date" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="notes">Pickup notes (optional)</label>
                            <textarea class="form-control" id="notes" name="notes" rows="3" placeholder="Airport pickup, helmet size, etc."></textarea>
                        </div>
                        <p class="mb-3" id="bookSummary">Select dates to see the total.</p>
                        <button type="submit" class="btn-roamitra btn-roamitra-navy" id="bookSubmit">Confirm booking</button>
                        <a href="index.html#rent-section" class="btn-roamitra btn-roamitra-ghost">Back to rentals</a>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/ai-assistant.js"></script>
    <script src="assets/js/booking.js"></script>
</body>
</html>
