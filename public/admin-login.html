<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff sign in — Roamitra</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/main.css?v=ui-sep25f" rel="stylesheet">
    <script src="assets/js/theme.js"></script>
</head>
<body>
<div class="auth-page">
    <div class="auth-visual">
        <div class="auth-visual-bg"></div>
        <div class="auth-visual-content">
            <a href="explore.html" class="auth-brand">
                <img src="assets/images/logo.png" alt="Roamitra" class="roamitra-logo-img">
                <span class="roamitra-logo-text" style="color:#fff;font-size:1.25rem;font-weight:700;">Roamitra</span>
            </a>
            <p style="font-size:0.8125rem;font-weight:700;letter-spacing:0.1em;opacity:0.7;margin-bottom:0.5rem;">STAFF ACCESS</p>
            <h1>Admin dashboard sign in.</h1>
            <p class="auth-tagline">This page is only for Roamitra staff. Travelers should use the member login.</p>
        </div>
    </div>
    <div class="auth-form-panel">
        <div class="auth-form-wrapper">
            <h2>Admin sign in</h2>
            <p class="auth-subtitle">Use your staff email</p>
            <form action="#" method="post" id="loginForm" data-role="admin">
                <div class="auth-form-group">
                    <label for="email">Admin email</label>
                    <div class="auth-input-wrap">
                        <i class="bi bi-envelope input-icon"></i>
                        <input type="email" id="email" name="email" placeholder="admin@raomitra.com" required autocomplete="username">
                    </div>
                </div>
                <div class="auth-form-group">
                    <label for="password">Password</label>
                    <div class="auth-input-wrap">
                        <i class="bi bi-lock input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-roamitra btn-roamitra-navy auth-submit" id="loginSubmit">
                    Sign in as admin <i class="bi bi-arrow-right"></i>
                </button>
            </form>
            <p class="auth-guest"><a href="login.html">Member sign in →</a></p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js?v=vercel3"></script>
<script src="assets/js/auth.js?v=adminrole1"></script>
</body>
</html>
