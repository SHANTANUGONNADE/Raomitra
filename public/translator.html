<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translator — Roamitra</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/main.css?v=ui-sep25f" rel="stylesheet">
    <script src="assets/js/theme.js"></script>
</head>
<body data-page="translator">
    <nav class="roamitra-navbar">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between">
                <a href="explore.html" class="navbar-brand">
                    <img src="assets/images/logo.png" alt="Roamitra" class="roamitra-logo-img">
                    <span class="roamitra-logo-text">Roamitra</span>
                </a>
                <ul class="roamitra-nav-links d-none d-lg-flex">
                    <li><a href="explore.html" class="nav-link" data-nav="home"><i class="bi bi-house"></i> Home</a></li>
                    <li><a href="explore.html" class="nav-link" data-nav="explore"><i class="bi bi-compass"></i> Explore</a></li>
                    <li><a href="community.html" class="nav-link" data-nav="community"><i class="bi bi-people"></i> Community</a></li>
                    <li><a href="explore.html" class="nav-link ai-link"><i class="bi bi-stars"></i> Roamini</a></li>
                </ul>
                <div class="roamitra-nav-actions d-none d-lg-flex">
                    <button class="roamitra-lang-select" type="button">EN <i class="bi bi-chevron-down" style="font-size:0.7rem;"></i></button>
                    <a href="login.html" class="btn-roamitra btn-roamitra-ghost">Log in</a>
                    <a href="signup.html" class="btn-roamitra btn-roamitra-primary">Sign up</a>
                </div>
                <button class="roamitra-navbar-toggler d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#mobileNav" aria-label="Toggle navigation"><i class="bi bi-list"></i></button>
            </div>
            <div class="collapse d-lg-none" id="mobileNav">
                <div class="roamitra-mobile-nav">
                    <a href="explore.html" class="nav-link">Explore</a>
                    <a href="community.html" class="nav-link">Community</a>
                    <div class="d-flex gap-2 mt-3">
                        <a href="login.html" class="btn-roamitra btn-roamitra-outline flex-fill">Log in</a>
                        <a href="signup.html" class="btn-roamitra btn-roamitra-primary flex-fill">Sign up</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <section class="translator-page">
        <div class="container" style="max-width:760px;">
            <h1 class="section-title">Translator</h1>
            <p class="section-subtitle">Type a phrase or speak it. We translate the text and can play the result aloud.</p>

            <form id="translateForm" class="translator-card" novalidate>
                <div class="lang-row mb-3">
                    <div>
                        <label class="form-label fw-semibold" for="sourceLang">Source language</label>
                        <select class="form-select" id="sourceLang" name="source_lang" required></select>
                    </div>
                    <button type="button" class="swap-langs" id="swapLangs" aria-label="Swap languages"><i class="bi bi-arrow-left-right"></i></button>
                    <div>
                        <label class="form-label fw-semibold" for="targetLang">Target language</label>
                        <select class="form-select" id="targetLang" name="target_lang" required></select>
                    </div>
                </div>

                <label class="form-label fw-semibold" for="sourceText">Phrase</label>
                <textarea class="form-control mb-3" id="sourceText" name="text" rows="4" placeholder="Type a phrase, or tap Speak"></textarea>
                <div class="translate-actions mb-3">
                    <button type="button" class="btn-roamitra btn-roamitra-navy" id="micBtn" aria-label="Speak to translate" aria-pressed="false">
                        <i class="bi bi-mic"></i> <span>Speak</span>
                    </button>
                    <button type="submit" class="btn-roamitra btn-roamitra-navy">Translate</button>
                </div>

                <div id="translateStatus" class="form-alert" hidden></div>

                <div id="translateResult" class="translated-box" hidden>
                    <div class="small text-muted mb-1">Translation</div>
                    <p class="translated-text mb-3 fw-semibold"></p>
                    <button type="button" class="btn-roamitra btn-roamitra-outline btn-roamitra-sm" id="speakResult">
                        <i class="bi bi-volume-up"></i> Play audio
                    </button>
                </div>
            </form>

            <div class="translator-card mt-3">
                <h2 class="h5">Recent translations</h2>
                <div id="translateHistory"><p class="text-muted">Sign in to save translation history.</p></div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js?v=vercel3"></script>
    <script src="assets/js/nav.js?v=navmenu10"></script>
    <script src="assets/js/ai-assistant.js?v=inr2"></script>
    <script src="assets/js/translator.js?v=voice5"></script>
</body>
</html>
