<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your itinerary — Roamitra</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/main.css?v=ui-sep25d" rel="stylesheet">
    <script src="assets/js/theme.js"></script>
</head>
<body data-page="planner">
    <nav class="roamitra-navbar">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between">
                <a href="explore.html" class="navbar-brand">
                    <img src="assets/images/logo.png" alt="Roamitra" class="roamitra-logo-img">
                    <span class="roamitra-logo-text">Roamitra</span>
                </a>
                <ul class="roamitra-nav-links d-none d-lg-flex">
                    <li><a href="explore.html" class="nav-link" data-nav="explore"><i class="bi bi-compass"></i> Explore</a></li>
                    <li><a href="community.html" class="nav-link" data-nav="community"><i class="bi bi-people"></i> Community</a></li>
                    <li><a href="planner.html" class="nav-link" data-nav="planner"><i class="bi bi-map"></i> Plan Trip</a></li>
                    <li><a href="#" class="nav-link ai-link"><i class="bi bi-stars"></i> Roamini</a></li>
                </ul>
                <div class="roamitra-nav-actions d-none d-lg-flex">
                    <button class="roamitra-lang-select" type="button">EN <i class="bi bi-chevron-down" style="font-size:0.7rem;"></i></button>
                    <a href="login.html" class="btn-roamitra btn-roamitra-ghost">Log in</a>
                    <a href="signup.html" class="btn-roamitra btn-roamitra-primary">Sign up</a>
                </div>
                <button class="roamitra-navbar-toggler d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#mobileNav" aria-label="Toggle navigation"><i class="bi bi-list"></i></button>
            </div>
            <div class="collapse d-lg-none" id="mobileNav">
                <div class="roamitra-mobile-nav">
                    <a href="explore.html" class="nav-link">Explore</a>
                    <a href="community.html" class="nav-link">Community</a>
                    <a href="planner.html" class="nav-link">Plan Trip</a>
                    <div class="d-flex gap-2 mt-3">
                        <a href="login.html" class="btn-roamitra btn-roamitra-outline flex-fill">Log in</a>
                        <a href="signup.html" class="btn-roamitra btn-roamitra-primary flex-fill">Sign up</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <section class="itinerary-page">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-3">
                <div>
                    <h1 class="section-title mb-1" id="tripTitle">Your itinerary</h1>
                    <p class="section-subtitle mb-0" id="tripMeta"></p>
                    <span class="version-pill" id="versionLabel"></span>
                </div>
                <div class="d-flex gap-2">
                    <a href="roamini.html" class="btn-roamitra btn-roamitra-navy btn-roamitra-sm" id="editTripBtn"><i class="bi bi-pencil"></i> Edit trip</a>
                    <a href="roamini.html" class="btn-roamitra btn-roamitra-navy btn-roamitra-sm">New trip</a>
                    <button type="button" class="btn-roamitra btn-roamitra-navy btn-roamitra-sm" id="saveTripBtn">Save trip</button>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-7">
                    <div id="itineraryRoot"><p class="text-muted">Loading itinerary…</p></div>
                </div>
                <div class="col-lg-5">
                    <aside class="travel-assistant" aria-label="AI Travel Assistant">
                        <header class="travel-assistant-header">
                            <img src="assets/images/ai-bot.jpeg" alt="Roamini" class="ai-bot-photo">
                            <div>
                                <h2>AI Travel Assistant</h2>
                                <p>Ask for real changes — I’ll update this itinerary.</p>
                            </div>
                        </header>
                        <div class="assistant-chips" role="group" aria-label="Quick requests">
                            <button type="button" class="assistant-chip" data-prompt="Add a nearby restaurant to day 1">Nearby restaurants</button>
                            <button type="button" class="assistant-chip" data-prompt="Find nearby cafés and add one">Nearby cafés</button>
                            <button type="button" class="assistant-chip" data-prompt="Remove the most expensive activity">Remove a place</button>
                            <button type="button" class="assistant-chip" data-prompt="Change timings to start later in the morning">Change timings</button>
                            <button type="button" class="assistant-chip" data-prompt="Rearrange day 1 activities">Rearrange</button>
                            <button type="button" class="assistant-chip" data-prompt="Suggest transportation options for this group">Transportation</button>
                            <button type="button" class="assistant-chip" data-prompt="Adjust the itinerary for rainy weather">Weather</button>
                            <button type="button" class="assistant-chip" data-prompt="Make this itinerary cheaper and stay on budget">Budget</button>
                            <button type="button" class="assistant-chip" data-prompt="Adjust the itinerary to my personal preferences">Preferences</button>
                        </div>
                        <div class="ai-assistant-messages travel-assistant-log" id="assistantLog"></div>
                        <form class="travel-assistant-form" id="assistantForm">
                            <label class="visually-hidden" for="assistantInput">Message the travel assistant</label>
                            <input type="text" id="assistantInput" placeholder="e.g. Add a café on day 2, remove the museum…" autocomplete="off" required>
                            <button type="submit" class="btn-roamitra btn-roamitra-navy" aria-label="Send">
                                <i class="bi bi-send-fill"></i>
                            </button>
                        </form>
                    </aside>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js?v=vercel3"></script>
    <script src="assets/js/nav.js?v=navmenu9"></script>
    <script src="assets/js/ai-assistant.js?v=inr2"></script>
    <script src="assets/js/itinerary.js?v=inr2"></script>
</body>
</html>
